# NGINX Reverse Proxy Configuration with TLS Certificate Pinning and HSTS Preload Compliance
# Production hardening for FF Arena - Laravel + Go + Rust microservices

# Upstream definitions with health checks
upstream laravel_backend {
    server 127.0.0.1:8000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

upstream go_payment_backend {
    server 127.0.0.1:8081 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

upstream rust_security_backend {
    server 127.0.0.1:8082 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=webhook:10m rate=100r/m;
limit_req_zone $binary_remote_addr zone=health:10m rate=120r/m;

# Map for CORS allowed origins - strict whitelist
map $http_origin $cors_allowed_origin {
    default "";
    "https://ffarena.com" "https://ffarena.com";
    "https://www.ffarena.com" "https://www.ffarena.com";
    "https://api.ffarena.com" "https://api.ffarena.com";
    "https://payment.ffarena.com" "https://payment.ffarena.com";
    "https://www.payment.ffarena.com" "https://www.payment.ffarena.com";
    "https://admin.ffarena.com" "https://admin.ffarena.com";
    "https://sandbox.ffarena.com" "https://sandbox.ffarena.com";
    "http://localhost:3000" "http://localhost:3000";
    "http://localhost:8080" "http://localhost:8080";
    "http://localhost:8000" "http://localhost:8000";
    "http://127.0.0.1:3000" "http://127.0.0.1:3000";
    "http://127.0.0.1:8080" "http://127.0.0.1:8080";
    "http://127.0.0.1:8000" "http://127.0.0.1:8000";
}

# Map for HSTS preload compliance - only allow * in development
map $http_origin $cors_allow_origin_value {
    default "";
    "~^https://.*\.ffarena\.com$" $http_origin;  # Allow *.ffarena.com subdomains
    "https://ffarena.com" "https://ffarena.com";
    "https://www.ffarena.com" "https://www.ffarena.com";
    "https://api.ffarena.com" "https://api.ffarena.com";
    "https://payment.ffarena.com" "https://payment.ffarena.com";
}

# TLS certificate pinning for outbound provider connections
# These pins are SHA256 hashes of SPKI (Subject Public Key Info) base64 encoded
# Generate with: openssl s_client -connect tokenized.sandbox.bka.sh:443 | openssl x509 -pubkey | openssl pkey -pubout | openssl pkey -pubout -outform der | openssl dgst -sha256 -binary | base64
# In Go, implement pinning via http.Client with custom VerifyPeerCertificate checking these pins

# Main server block - HTTP to HTTPS redirect (required for HSTS preload)
server {
    listen 80;
    listen [::]:80;
    server_name ffarena.com www.ffarena.com api.ffarena.com payment.ffarena.com security.ffarena.com sandbox.ffarena.com api.sandbox.ffarena.com payment.sandbox.ffarena.com;

    # Required for HSTS preload - redirect HTTP to HTTPS on same host
    location / {
        return 301 https://$host$request_uri;
    }

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}

# Laravel API - https://api.ffarena.com
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.ffarena.com;

    # TLS configuration - enforce TLS 1.2+
    ssl_certificate /etc/nginx/certs/api.ffarena.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/api.ffarena.com/privkey.pem;
    ssl_trusted_certificate /etc/nginx/certs/api.ffarena.com/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # HSTS preload compliance - 1 year, includeSubDomains, preload
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), gyroscope=(), speaker=()" always;
    add_header Vary "Origin" always;

    # Remove server header
    server_tokens off;
    more_clear_headers Server;

    # Security: Limit request size to 2MB
    client_max_body_size 2m;
    client_body_buffer_size 128k;

    # Rate limiting
    limit_req zone=api burst=20 nodelay;
    limit_req_status 429;

    # Logging with redaction
    access_log /var/log/nginx/api.ffarena.com.access.log json_combined;
    error_log /var/log/nginx/api.ffarena.com.error.log warn;

    # Health checks - no auth, no rate limiting strict
    location ~ ^/health(/live|/ready)?$ {
        limit_req zone=health burst=40 nodelay;
        proxy_pass http://laravel_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $http_x_request_id;
        proxy_set_header X-Trace-ID $http_x_trace_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
    }

    # API endpoints
    location / {
        # CORS handling
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin $cors_allowed_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Request-ID, Idempotency-Key, X-Idempotency-Key, X-Signature, X-Service-ID, X-Timestamp, X-Nonce, X-Provider-Signature, traceparent, X-Trace-ID, X-Span-ID" always;
            add_header Access-Control-Expose-Headers "X-Request-ID, X-Trace-ID, X-Span-ID" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }

        # Check if origin allowed
        if ($http_origin != "") {
            set $cors_check 0;
            if ($cors_allowed_origin = "") {
                set $cors_check 1;
            }
            if ($cors_check = 1) {
                return 403;
            }
        }

        add_header Access-Control-Allow-Origin $cors_allowed_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Request-ID, Idempotency-Key, X-Idempotency-Key, X-Signature, X-Service-ID, X-Timestamp, X-Nonce, X-Provider-Signature, traceparent, X-Trace-ID, X-Span-ID" always;
        add_header Access-Control-Expose-Headers "X-Request-ID, X-Trace-ID, X-Span-ID" always;

        proxy_pass http://laravel_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $http_x_request_id;
        proxy_set_header X-Trace-ID $http_x_trace_id;
        proxy_set_header X-Span-ID $http_x_span_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
        proxy_buffering off;
    }
}

