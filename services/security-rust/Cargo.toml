[package]
name = "security-rust"
version = "1.0.0"
edition = "2021"
description = "FF Arena Security Services - Fraud Detection"
authors = ["FF Arena"]
license = "MIT"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
warp = { version = "0.3", features = ["tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dashmap = "5.5"
jsonwebtoken = "8.3"
aes-gcm = "0.10"
base64 = "0.22"
rand = "0.8"
sha2 = "0.10"
hmac = "0.12"
uuid = { version = "1.6", features = ["v4","serde"] }
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
env_logger = "0.11"

[[bin]]
name = "security-rust"
path = "src/main.rs"
